spring:
  application:
    name: kipper
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3310}/kipper_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
server:
  port: 8080

app:
  firebase:
    config-file: firebase-service-account.json
name: CI Java Maven Docker & Kubernetes

on:
  push:
    branches: [ "main" ]

jobs:
  # Job 1: Build da aplicação Java com Maven
  build-maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build do Projeto com Maven
        run: mvn clean package -DskipTests

      - name: Salvar Artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # Job 2: Construção e Push da Imagem Docker
  docker-build:
    runs-on: ubuntu-latest
    needs: build-maven
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Artefato JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da Imagem Docker
        run: docker build -t manupred_be .

      - name: Tag e Push da Imagem
        run: |
          docker tag manupred_be ${{ secrets.DOCKER_USERNAME }}/manupred_be:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/manupred_be:latest

  # Job 3: Implantação no Kubernetes via Runner Self-Hosted
  deploy-k8s:
    runs-on: self-hosted
    needs: docker-build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Aplicar Manifestos no Kubernetes
        run: kubectl apply -f k8s/deployment.yaml
